spring:
  application:
    name: task-tracker-backend

  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 2m
    refresh-ttl: 7d
    refresh-cookie-secure: false

  cleanup-tokens:
    initial-delay-hours: 1
    fixed-rate-hours: 1