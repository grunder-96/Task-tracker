name: task-tracker

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: grunder96/task-tracker-backend:latest
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  email-sender:
    image: grunder96/task-tracker-email-sender:latest
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  summarization-server:
    image: grunder96/task-tracker-summarization-server:latest
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: grunder96/task-tracker-scheduler:latest
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # used by init-summarization-db.sh to create the summarization database
      SUMMARIZATION_DB_NAME: ${SUMMARIZATION_DB_NAME}
      SUMMARIZATION_DB_USER: ${SUMMARIZATION_DB_USER}
      SUMMARIZATION_DB_PASSWORD: ${SUMMARIZATION_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./init-summarization-db.sh:/docker-entrypoint-initdb.d/init-summarization-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,INTERNAL://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  kafka_data:
  caddy_data:
  caddy_config: